# Where HeyListen's tools send things, and the pages they link to: the one place to edit when a service moves.
# Read by nx2/addresses.py (address(key)). A key left out or empty turns that use off: nothing is sent, and what was
# waiting stays for next time.
[addresses]
# The HeyListen telemetry server (https only, no trailing path): the game posts a crash report to <it>/telemetry/crash (the crash
# window's Report automatically, and the "Send crash reports automatically" row) and a performance summary to
# <it>/telemetry/perf (the "Send performance statistics" row). make_game.py stamps it into the game folder's
# hookshot_version.txt as telemetry=. EMPTY by default: nothing can be sent, and the menu's two rows say "not available in this
# build". For a test against a local server, HL_TELEMETRY_URL in the environment replaces it for that run (docs/performance-statistics.md).
telemetry = https://141-253-120-55.sslip.io
# The issue the crash reports are collected on, if there is one: the Sent box's link (only a link to this issue or one of its
# comments). Empty: the Sent box links nothing.
crash_issue =
